<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Plate - Segurança Condominial</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- FONTES -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* =========================
   VARIÁVEIS
========================= */

:root{
    --primary:#00d2ff;
    --secondary:#3a7bd5;
    --accent:#25D366;
    --dark:#0a0f1a;
    --glass:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.1);
    --text:#e0e6ed;
    --error:#ff4d4d;
}

/* =========================
   BODY
========================= */

body{

    font-family:'Plus Jakarta Sans',sans-serif;

    background:
    radial-gradient(circle at top left, rgba(58,123,213,0.2), transparent 40%),
    radial-gradient(circle at bottom right, rgba(0,210,255,0.1), transparent 40%),
    var(--dark);

    color:var(--text);

    min-height:100vh;

    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

header{
    text-align:center;
    padding:35px 20px 20px;
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
}

.logo-icon{

    width:55px;
    height:55px;

    border-radius:14px;

    background:linear-gradient(135deg,var(--primary),var(--secondary));

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
    font-family:'Orbitron',sans-serif;

    color:white;

    box-shadow:0 0 25px rgba(0,210,255,0.5);
}

.logo h1{
    font-size:30px;
    font-family:'Orbitron',sans-serif;

    background:linear-gradient(to right,#fff,var(--primary));

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub{
    margin-top:15px;
    font-size:0.8rem;
    color:#b5c3d1;
    letter-spacing:1px;
}

/* =========================
   NAV
========================= */

nav{
    display:flex;
    justify-content:center;
    gap:12px;

    margin:25px 0;
}

nav button{

    padding:12px 22px;

    border:none;
    border-radius:30px;

    background:var(--glass);

    border:1px solid var(--border);

    color:white;

    cursor:pointer;

    font-weight:700;

    transition:0.3s;
}

nav button.active{
    background:white;
    color:#000;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:450px;

    margin:auto;

    padding:0 20px 30px;
}

/* =========================
   CARD
========================= */

.card{

    display:none;

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:25px;

    backdrop-filter:blur(20px);

    padding:30px;
}

.card.active{
    display:block;
}

/* =========================
   PLACA
========================= */

.placa{

    width:170px;
    height:70px;

    margin:0 auto 25px;

    background:white;

    border-radius:8px;

    overflow:hidden;

    border:2px solid #333;
}

.placa-topo{

    background:#003399;

    color:white;

    font-size:10px;

    font-weight:800;

    text-align:center;

    padding:4px;
}

.placa-numero{

    display:flex;
    align-items:center;
    justify-content:center;

    height:calc(100% - 20px);

    color:#111;

    font-size:24px;
    font-weight:900;

    letter-spacing:3px;
}

/* =========================
   INPUTS
========================= */

.input-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;

    color:var(--primary);

    font-size:0.85rem;
    font-weight:700;
}

input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid var(--border);

    background:rgba(0,0,0,0.4);

    color:white;

    outline:none;

    font-size:1rem;
}

/* =========================
   BOTÕES
========================= */

.btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    font-weight:800;

    transition:0.3s;
}

.btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.btn-whatsapp{
    margin-top:18px;
    background:var(--accent);
    color:white;
}

.btn-back{
    margin-bottom:20px;

    background:transparent;

    border:1px solid var(--border);

    color:white;

    padding:10px 15px;

    border-radius:12px;

    cursor:pointer;
}

/* =========================
   RESULTADO
========================= */

.resultado{

    margin-top:20px;

    border-radius:15px;

    overflow:hidden;

    border:1px solid var(--border);
}

.item{

    display:flex;
    justify-content:space-between;

    padding:14px;

    background:rgba(255,255,255,0.03);

    border-bottom:1px solid var(--border);
}

.item:last-child{
    border:none;
}

/* =========================
   STATUS
========================= */

.status{

    margin-top:18px;

    padding:14px;

    border-radius:12px;

    text-align:center;

    font-weight:700;
}

.success{
    background:rgba(37,211,102,0.1);
    color:#25D366;
}

.error{
    background:rgba(255,77,77,0.1);
    color:var(--error);
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:20px;
    font-size:0.75rem;
    color:#8190a5;
}

</style>
</head>

<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            S
        </div>

        <h1>System Plate</h1>

    </div>

    <div class="sub">
        🛡️ SISTEMA CLOUD PARA CONDOMÍNIO
    </div>

</header>

<nav>

    <button
    class="active"
    id="btnPesquisa"
    onclick="abrirPagina('pesquisa')">
    🔍 Buscar
    </button>

    <button
    id="btnCadastro"
    onclick="abrirPagina('cadastro')">
    ➕ Cadastrar
    </button>

</nav>

<div class="container">

    <!-- PESQUISA -->

    <section id="pesquisa" class="card active">

        <div class="placa">

            <div class="placa-topo">
                BRASIL
            </div>

            <div class="placa-numero" id="placaDisplay">
                SYS2026
            </div>

        </div>

        <div class="input-group">

            <label>Placa do Veículo</label>

            <input
            type="text"
            id="placaPesquisa"
            placeholder="Digite a placa">

        </div>

        <button
        class="btn btn-primary"
        onclick="pesquisarVeiculo()">

        CONSULTAR AGORA

        </button>

        <div id="resultadoPesquisa"></div>

        <div id="areaWhatsapp"></div>

    </section>

    <!-- CADASTRO -->

    <section id="cadastro" class="card">

        <button
        class="btn-back"
        onclick="abrirPagina('pesquisa')">

        ← Voltar

        </button>

        <div class="input-group">

            <label>Placa</label>

            <input
            type="text"
            id="placa"
            placeholder="ABC1234">

        </div>

        <div class="input-group">

            <label>Modelo / Cor</label>

            <input
            type="text"
            id="modelo"
            placeholder="Corolla Branco">

        </div>

        <div class="input-group">

            <label>Bloco</label>

            <input
            type="text"
            id="bloco"
            placeholder="Bloco">

        </div>

        <div class="input-group">

            <label>Apartamento</label>

            <input
            type="text"
            id="apartamento"
            placeholder="Apartamento">

        </div>

        <button
        class="btn btn-primary"
        id="btnSalvar"
        onclick="cadastrarVeiculo()">

        SALVAR NO SISTEMA

        </button>

        <div id="statusCadastro"></div>

    </section>

</div>

<footer>
Francisco © 2026 | Cloud DB v2.0
</footer>

<script>

/* =========================
   CONFIGURAÇÃO SUPABASE
========================= */

/*
SUBSTITUA PELOS DADOS DO SEU PROJETO
*/

const SUPABASE_URL = "SUA_URL_SUPABASE";
const SUPABASE_KEY = "SUA_CHAVE_PUBLICA_SUPABASE";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let veiculoAtual = null;

/* =========================
   TROCAR TELAS
========================= */

function abrirPagina(id){

    document.querySelectorAll(".card")
    .forEach(card => {
        card.classList.remove("active");
    });

    document.getElementById(id)
    .classList.add("active");

    document.querySelectorAll("nav button")
    .forEach(btn => {
        btn.classList.remove("active");
    });

    if(id === "pesquisa"){
        document.getElementById("btnPesquisa")
        .classList.add("active");
    }

    if(id === "cadastro"){
        document.getElementById("btnCadastro")
        .classList.add("active");
    }
}

/* =========================
   FORMATAR PLACA
========================= */

function formatarPlaca(valor){

    return valor
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,'')
    .trim();
}

/* =========================
   CADASTRAR
========================= */

async function cadastrarVeiculo(){

    const placa = formatarPlaca(
        document.getElementById("placa").value
    );

    const modelo =
    document.getElementById("modelo").value.trim();

    const bloco =
    document.getElementById("bloco").value.trim();

    const apartamento =
    document.getElementById("apartamento").value.trim();

    const status =
    document.getElementById("statusCadastro");

    const btn =
    document.getElementById("btnSalvar");

    if(!placa || !modelo || !bloco || !apartamento){

        status.innerHTML = `
        <div class="status error">
            ⚠️ Preencha todos os campos.
        </div>`;

        return;
    }

    btn.disabled = true;
    btn.innerText = "SALVANDO...";

    try{

        const { data: existe } = await supabaseClient
        .from("veiculos")
        .select("placa")
        .eq("placa", placa)
        .maybeSingle();

        if(existe){

            status.innerHTML = `
            <div class="status error">
                ⚠️ Placa já cadastrada.
            </div>`;

            btn.disabled = false;
            btn.innerText = "SALVAR NO SISTEMA";

            return;
        }

        const { error } = await supabaseClient
        .from("veiculos")
        .insert([
            {
                placa,
                modelo,
                bloco,
                apartamento
            }
        ]);

        if(error){

            status.innerHTML = `
            <div class="status error">
                ❌ ${error.message}
            </div>`;

        } else {

            status.innerHTML = `
            <div class="status success">
                ✅ Veículo cadastrado.
            </div>`;

            document.getElementById("placa").value = "";
            document.getElementById("modelo").value = "";
            document.getElementById("bloco").value = "";
            document.getElementById("apartamento").value = "";

            setTimeout(()=>{
                status.innerHTML = "";
            },3000);
        }

    } catch(error){

        status.innerHTML = `
        <div class="status error">
            ❌ Erro inesperado.
        </div>`;
    }

    btn.disabled = false;
    btn.innerText = "SALVAR NO SISTEMA";
}

/* =========================
   PESQUISAR
========================= */

async function pesquisarVeiculo(){

    const placa = formatarPlaca(
        document.getElementById("placaPesquisa").value
    );

    const resultado =
    document.getElementById("resultadoPesquisa");

    const areaWhatsapp =
    document.getElementById("areaWhatsapp");

    const placaDisplay =
    document.getElementById("placaDisplay");

    if(!placa) return;

    resultado.innerHTML = `
    <div class="status">
        🔎 Buscando...
    </div>`;

    try{

        const { data, error } = await supabaseClient
        .from("veiculos")
        .select("*")
        .eq("placa", placa)
        .maybeSingle();

        if(data){

            veiculoAtual = data;

            placaDisplay.innerText = data.placa;

            resultado.innerHTML = `

            <div class="resultado">

                <div class="item">
                    <span>🚘 Veículo</span>
                    <strong>${data.modelo}</strong>
                </div>

                <div class="item">
                    <span>🏢 Bloco</span>
                    <strong>${data.bloco}</strong>
                </div>

                <div class="item">
                    <span>🚪 Apartamento</span>
                    <strong>${data.apartamento}</strong>
                </div>

            </div>
            `;

            areaWhatsapp.innerHTML = `
            <button
            class="btn btn-whatsapp"
            onclick="enviarWhatsapp()">

            📱 ENVIAR NOTIFICAÇÃO

            </button>
            `;

        } else {

            veiculoAtual = null;

            placaDisplay.innerText = "OFFLINE";

            resultado.innerHTML = `
            <div class="status error">
                ❌ Placa não encontrada.
            </div>`;

            areaWhatsapp.innerHTML = "";
        }

    } catch(error){

        resultado.innerHTML = `
        <div class="status error">
            ❌ Erro ao consultar banco.
        </div>`;
    }
}

/* =========================
   WHATSAPP
========================= */

function enviarWhatsapp(){

    if(!veiculoAtual) return;

    const mensagem =
`*VEÍCULO SEM IDENTIFICAÇÃO*%0A%0A
🚘 Veículo: ${veiculoAtual.modelo}%0A
🏢 Bloco: ${veiculoAtual.bloco}%0A
🚪 Apartamento: ${veiculoAtual.apartamento}%0A
🆔 Placa: ${veiculoAtual.placa}`;

    /*
    TROQUE PELO NÚMERO REAL
    */

    const numero = "5511999999999";

    window.open(
        `https://wa.me/${numero}?text=${mensagem}`,
        "_blank"
    );
}

/* =========================
   ENTER PESQUISA
========================= */

document
.getElementById("placaPesquisa")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        pesquisarVeiculo();
    }
});

</script>

</body>
</html>
